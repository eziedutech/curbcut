# Local mirror of production: frontrouter is the only published port.
#
#   GIT_SHA=$(git rev-parse --short HEAD) docker compose up --build
#   then open http://localhost:3320

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: curbcut
      POSTGRES_USER: curbcut
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "curbcut", "-d", "curbcut"]
      interval: 5s
      timeout: 3s
      retries: 10

  backpy:
    build:
      context: ./codes/backpy
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql://curbcut:${LOCAL_POSTGRES_PASSWORD:-local-only}@postgres:5432/curbcut
      CURBCUT_INGEST_TOKEN: ${CURBCUT_INGEST_TOKEN:-local-token}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontrouter:
    build:
      context: ./codes/frontrouter
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      APP_ENV: local
      BACKPY_INTERNAL_URL: http://backpy:8000
    ports:
      - "${FRONT_PORT:-3320}:3000"
    depends_on:
      backpy:
        condition: service_healthy

volumes:
  postgres-data:
