[project]
name = "curbcut-backpy"
version = "0.1.0"
description = "CurbCut report API: stores review reports and serves them to the dashboard."
requires-python = "==3.14.*"
# Versions checked on PyPI on 26 Sep 2026 and pinned exactly.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
    "asyncpg==0.31.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx2==2.13.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
